name: Install pinned native XML dependencies
description: Restore binary archives while rebuilding the installed tree through vcpkg.
inputs:
  family:
    description: Native runner family.
    required: true
  triplet:
    description: Existing static native dependency triplet.
    required: true
  baseline:
    description: Exact source-pinned vcpkg commit.
    required: true
runs:
  using: composite
  steps:
    - name: Test native cache contract
      shell: bash
      run: bash scripts/test-native-cache.sh

    - name: Identify native cache inputs
      id: identity
      shell: bash
      env:
        CACHE_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        NATIVE_FAMILY: ${{ inputs.family }}
        TRIPLET: ${{ inputs.triplet }}
        VCPKG_COMMIT: ${{ inputs.baseline }}
        CACHE_INPUTS: ${{ hashFiles('packaging/vcpkg/**', '.github/actions/native-xml/**', '.github/workflows/rust-release.yml', 'scripts/native-cache-contract.sh') }}
      run: |
        key="$(bash scripts/native-cache-contract.sh key "$CACHE_PLATFORM" "${ImageOS:?}-${ImageVersion:?}" "$NATIVE_FAMILY" "$TRIPLET" "$VCPKG_COMMIT" "$CACHE_INPUTS")"
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Restore native binary archives
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/vcpkg-archives
        key: ${{ steps.identity.outputs.key }}

    - name: Install pinned XML dependencies on Unix
      id: unix
      if: inputs.family != 'windows'
      shell: bash
      env:
        NATIVE_FAMILY: ${{ inputs.family }}
        TRIPLET: ${{ inputs.triplet }}
        VCPKG_COMMIT: ${{ inputs.baseline }}
        VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-archives
        VCPKG_BINARY_SOURCES: clear;default,readwrite
      run: |
        if [ "$NATIVE_FAMILY" = linux ]; then
          sudo apt-get update
          sudo apt-get install --yes pkg-config
        else
          brew install pkg-config
        fi
        mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
        git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
        git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
        "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        "$RUNNER_TEMP/vcpkg/vcpkg" install \
          --triplet "$TRIPLET" \
          --x-manifest-root="$GITHUB_WORKSPACE/packaging/vcpkg" \
          --x-install-root="$RUNNER_TEMP/vcpkg/installed"
        {
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/vcpkg/installed/$TRIPLET/lib/pkgconfig"
          echo "LIBXML2_STATIC=1"
          echo "LIBXSLT_STATIC=1"
        } >> "$GITHUB_ENV"

    - name: Install pinned XML dependencies on Windows
      id: windows
      if: inputs.family == 'windows'
      shell: pwsh
      env:
        TRIPLET: ${{ inputs.triplet }}
        VCPKG_COMMIT: ${{ inputs.baseline }}
        VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-archives
        VCPKG_BINARY_SOURCES: clear;default,readwrite
      run: |
        New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
        if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed." }
        git -C "$env:RUNNER_TEMP\vcpkg" checkout $env:VCPKG_COMMIT
        if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout failed." }
        & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed." }
        & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install `
          --triplet $env:TRIPLET `
          --x-manifest-root="$env:GITHUB_WORKSPACE\packaging\vcpkg" `
          --x-install-root="$env:RUNNER_TEMP\vcpkg\installed"
        if ($LASTEXITCODE -ne 0) { throw "vcpkg installation failed." }
        "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VCPKGRS_TRIPLET=$env:TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CARGO_BUILD_TARGET=x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Verify mandatory native installation
      if: always()
      shell: bash
      env:
        NATIVE_FAMILY: ${{ inputs.family }}
        UNIX_OUTCOME: ${{ steps.unix.outcome }}
        WINDOWS_OUTCOME: ${{ steps.windows.outcome }}
      run: bash scripts/native-cache-contract.sh verify "$NATIVE_FAMILY" "$UNIX_OUTCOME" "$WINDOWS_OUTCOME"
